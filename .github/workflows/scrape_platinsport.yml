name: Scrape Platinsport Events (Playwright)

on:
  schedule:
    # Esegui ogni ora
    - cron: '0 * * * *'
  
  # Permetti esecuzione manuale
  workflow_dispatch:
  
  # Esegui anche ad ogni push (per test)
  push:
    branches:
      - main

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install playwright beautifulsoup4 lxml
      
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium
      
      - name: Run Platinsport scraper
        run: |
          python scrape_platinsport_playwright.py
      
      - name: Check for changes
        id: verify_diff
        run: |
          git diff --quiet . || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push if changed
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.json
          git commit -m "🔄 Auto-update Platinsport events - $(date -u +'%Y-%m-%d %H:%M UTC')" || exit 0
          git push
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()  # Carica anche se lo script fallisce
        with:
          name: platinsport-events
          path: |
            platinsport_*.json
            debug_*.png
            debug_*.html
          retention-days: 7
